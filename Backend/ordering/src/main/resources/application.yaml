spring:
  application:
    name: dining_operation_app

  profiles:
    active: local

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        tenant_identifier_resolver: com.qr_ordering_system.app.common.tenant.HibernateTenantIdentifierResolver

server:
  shutdown: graceful

management:
  endpoint:
    flyway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,flyway

app:
  upload:
    dir: uploads/menu-images

  public:
    # Origin that serves the customer storefront (the Angular app).
    # The API stamps {base-url}/t/{qrSlug} into every table's qrUrl so the
    # frontend never assembles QR URLs itself. Local dev = the dev server;
    # production = the real domain the printed QR codes point at.
    base-url: http://localhost:4200