spring:
  flyway:
    repair-on-migrate: true
  datasource:
    url: jdbc:postgresql://localhost:5432/dining_operation_app
    username: postgres
    password: postgre

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

logging:
  level:
    org.flywaydb: debug
    org.springframework.boot.autoconfigure.flyway: debug
    org.hibernate.SQL: debug

app:
  upload:
    dir: uploads/menu-images
    public-path: /uploads/menu-images

  public:
    # QR codes minted in local dev point at the Angular dev server, so a
    # phone scanning them (same Wi-Fi) opens the dev storefront.
    base-url: http://localhost:4200

  security:
    jwt:
      secret: local_dev_secret_change_me_please_1234567890_abcdef_1234567890
      expiration-ms: 3600000


#      Important:
#      The JWT secret must be long enough for HS256.
#      For local development, this is okay.
#      For production later, use environment variables.