<div class="flex items-center justify-between w-full mb-6">
  <div class="font-serif text-2xl tracking-tight text-stone-900">
    <h1>Menu Items</h1>
  </div>

  <div>
    <button type="button" class="btn btn-neutral" (click)="openModal()">+ New Menu Item</button>
  </div>
</div>

<dialog #productModal id="product_modal" class="modal">
  <div class="modal-box bg-[#FBF9F6] text-[#191919]">
    <button type="button" (click)="closeModal()" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
    <h3 class="font-serif text-xl font-bold tracking-tight text-stone-900">Create New Menu Item</h3>

    <form [formGroup]="productForm" (ngSubmit)="saveProduct()" class="space-y-4 mt-4">

      <!-- Select Category -->
      <div class="form-control w-full">
        <label class="label pb-1">
          <span class="label-text font-serif text-sm font-medium text-stone-700">Choose Category</span>
        </label>
        <select formControlName="categoryId" class="select select-bordered w-full bg-white rounded-lg">
          <option value="" disabled>Select a category</option>
          @for (cat of categories(); track cat.id) {
            <option [value]="cat.id">{{ cat.localizedNames.en }}</option>
          }
        </select>
      </div>

      <!-- Item Name (English) -->
      <div class="form-control w-full">
        <label class="label pb-1">
          <span class="label-text font-serif text-sm font-medium text-stone-700">Item Name (English)</span>
        </label>
        <input
          type="text"
          formControlName="name"
          placeholder="eg. Shan Noodle"
          class="input input-bordered w-full rounded-lg"
        />
      </div>

      <!-- Item Name (Myanmar) -->
      <div class="form-control w-full">
        <label class="label pb-1">
          <span class="label-text font-serif text-sm font-medium text-stone-700">မေနူး အမည် (မြန်မာ)</span>
        </label>
        <input
          type="text"
          formControlName="myanmarName"
          placeholder="eg. ရှမ်းခေါက်ဆွဲ"
          class="input input-bordered w-full rounded-lg"
        />
      </div>

      <!-- Base Price -->
      <div class="form-control w-full">
        <label class="label pb-1">
          <span class="label-text font-serif text-sm font-medium text-stone-700">Base Price (MMK)</span>
        </label>
        <input
          type="number"
          formControlName="price"
          min="0"
          placeholder="0"
          class="input input-bordered w-full bg-white rounded-lg"
        />
      </div>

      <!-- Image Upload -->
      <div class="form-control w-full">
        <label class="label pb-1">
          <span class="label-text font-serif text-sm font-medium text-stone-700">Image URL</span>
        </label>
        <input
          type="text"
          formControlName="imageUrl"
          placeholder="https://example.com/image.jpg"
          class="input input-bordered w-full rounded-lg"
        />
      </div>

      <!-- English Description -->
      <div class="form-control w-full">
        <label class="label pb-1">
          <span class="label-text font-serif text-sm font-medium text-stone-700">Description (English)</span>
        </label>
        <textarea
          formControlName="descriptionEn"
          placeholder="English Food Description..."
          class="textarea textarea-bordered w-full bg-white rounded-lg h-24"
        ></textarea>
      </div>

      <!-- Myanmar Description -->
      <div class="form-control w-full">
        <label class="label pb-1">
          <span class="label-text font-serif text-sm font-medium text-stone-700">အသေးစိတ် ဖော်ပြချက် (မြန်မာ)</span>
        </label>
        <textarea
          formControlName="descriptionMm"
          placeholder="အသေးစိတ် ဖော်ပြချက် (မြန်မာ)..."
          class="textarea textarea-bordered w-full bg-white rounded-lg h-24"
        ></textarea>
      </div>

      <!-- Actions -->
      <div class="modal-action pt-2">
        <button type="button" class="btn btn-ghost" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-neutral">Save Menu Item</button>
      </div>
    </form>
  </div>
</dialog>
