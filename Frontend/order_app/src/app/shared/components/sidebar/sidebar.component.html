<div class="drawer lg:drawer-open">
  <input id="my-drawer-4" type="checkbox" class="drawer-toggle" />
  
  <div class="drawer-content">
    <!-- Navbar -->
    <nav class="navbar w-full bg-oklch(44.6% 0.03 256.802)">

      <div class="navbar-start flex items-center">
        <label for="my-drawer-4" aria-label="open sidebar" class="btn btn-square btn-ghost">
          <!-- Sidebar toggle icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4"><path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"></path><path d="M9 4v16"></path><path d="M14 10l2 2l-2 2"></path></svg>
        </label>

        <div class="px-4 font-serif text-lg font-medium tracking-tight text-stone-900 sm:text-1xl">
          {{ authService.businessName() }}
        </div>
      </div>

      <div class="navbar-end flex items-center gap-4">
        <span class="badge badge-lg badge-outline font-serif text-md items-center tracking-tight text-stone-900 sm:text-1xl">
          {{ authService.currentRole() }}
        </span>

        <button class="btn btn-neutral" (click)="onLogout()">Logout</button>  
      </div>
    
    </nav>
    
    <!-- Page content here -->
    <div class="p-4">
      <router-outlet></router-outlet>
    </div>
  </div>

  <div class="drawer-side is-drawer-close:overflow-visible">
    <label for="my-drawer-4" aria-label="close sidebar" class="drawer-overlay"></label>
    <div class="flex min-h-full flex-col items-start bg-oklch(44.6% 0.03 256.802) is-drawer-close:w-14 is-drawer-open:w-64">
      <!-- Sidebar content here -->

       <!-- 0. User Profile Section -->
    <div class="flex items-center gap-3 p-4 w-full border-b border-stone-300/20 mb-2 is-drawer-close:p-2 is-drawer-close:justify-center is-drawer-close:gap-0">
      <div class="w-10 h-10 rounded-full bg-stone-300/20 flex items-center justify-center text-stone-900 shrink-0">
        <!-- User Icon SVG -->
       <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-user-circle">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
        <path d="M9 10a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
        <path d="M6.168 18.849a4 4 0 0 1 3.832 -2.849h4a4 4 0 0 1 3.834 2.855" />
      </svg>
      </div>
      <div class="is-drawer-close:hidden flex flex-col leading-tight">
        <!-- Replace authService.userName() with your actual property if different -->
        <span class="font-medium text-sm truncate max-w-[140px]">{{authService.displayName()}}</span>
        <span class="text-xs opacity-70 truncate max-w-[140px]">Role</span>
      </div>
    </div>


      <ul class="menu w-full grow">
        
        <!-- 1. Diner Storefront (No permission required) -->
        <li *appHasPermission="'MENU_VIEW'">
          <a routerLink="store" routerLinkActive="active" 
             class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Diner Storefront">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-building-store">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M3 21l18 0" />
              <path d="M3 7v1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1h-18l2 -4h14l2 4" />
              <path d="M5 21l0 -10.15" />
              <path d="M19 21l0 -10.15" />
              <path d="M9 21v-4a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v4" />
            </svg>
            <span class="is-drawer-close:hidden">Diner Storefront</span>
          </a>
        </li>

        <!-- 2. Financial Dashboard (Requires REPORT_VIEW) -->
        <li *appHasPermission="'REPORT_VIEW'">
          <a routerLink="/management/dashboard" routerLinkActive="active" 
             class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Financial Dashboard">
             <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-report-money">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" />
              <path d="M9 5a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2" />
              <path d="M14 11h-2.5a1.5 1.5 0 0 0 0 3h1a1.5 1.5 0 0 1 0 3h-2.5" />
              <path d="M12 17v1m0 -8v1" />
            </svg>
            <span class="is-drawer-close:hidden">Financial Dashboard</span>
          </a>
        </li>

        <!-- 3. Manage Menu (Requires MENU_EDIT) -->
        <li *appHasPermission="'MENU_MANAGE'">
          <a routerLink="/management/menu_management" routerLinkActive="active" 
             class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Manage Menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-tools-kitchen-3">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M7 4v17m-3 -17v3a3 3 0 1 0 6 0v-3" />
            <path d="M14 8a3 4 0 1 0 6 0a3 4 0 1 0 -6 0" />
            <path d="M17 12v9" />
          </svg>
            <span class="is-drawer-close:hidden">Menu Management</span>
          </a>
        </li>

        <!-- 4. Role & Checkbox Matrix (Requires USER_MANAGE) -->
        <li *appHasPermission="'USER_MANAGE'">
          <a routerLink="/management/user_manage" routerLinkActive="active" 
            class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="User Management">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-user-edit">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
              <path d="M6 21v-2a4 4 0 0 1 4 -4h3.5" />
              <path d="M18.42 15.61a2.1 2.1 0 0 1 2.97 2.97l-3.39 3.42h-3v-3l3.42 -3.39" />
            </svg>
            <span class="is-drawer-close:hidden">User Management</span>
          </a>
        </li>

          <!-- 5. Kitchen Management (Requires KDS_VIEW) -->
        <li *appHasPermission="'KDS_VIEW'">
          <a routerLink="/management/kitchen_display" routerLinkActive="active" 
             class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Kitchen Management">
             <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-chef-hat">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M12 3c1.918 0 3.52 1.35 3.91 3.151a4 4 0 0 1 2.09 7.723l0 7.126h-12v-7.126a4 4 0 1 1 2.092 -7.723a4 4 0 0 1 3.908 -3.151" />
              <path d="M6.161 17.009l11.839 -.009" />
            </svg>
            <span class="is-drawer-close:hidden">Kitchen Display</span>
          </a>
        </li>

         <!-- Payments (Requires PAYMENT_VIEW) -->
         <li *appHasPermission="'PAYMENT_VIEW'">
          <a routerLink="/management/payments" routerLinkActive="active" 
             class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Payments">
             <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-cash-register">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M21 15h-2.5c-.398 0 -.779 .158 -1.061 .439c-.281 .281 -.439 .663 -.439 1.061c0 .398 .158 .779 .439 1.061c.281 .281 .663 .439 1.061 .439h1c.398 0 .779 .158 1.061 .439c.281 .281 .439 .663 .439 1.061c0 .398 -.158 .779 -.439 1.061c-.281 .281 -.663 .439 -1.061 .439h-2.5" />
              <path d="M19 21v1m0 -8v1" />
              <path d="M13 21h-7c-.53 0 -1.039 -.211 -1.414 -.586c-.375 -.375 -.586 -.884 -.586 -1.414v-10c0 -.53 .211 -1.039 .586 -1.414c.375 -.375 .884 -.586 1.414 -.586h2m12 3.12v-1.12c0 -.53 -.211 -1.039 -.586 -1.414c-.375 -.375 -.884 -.586 -1.414 -.586h-2" />
              <path d="M16 10v-6c0 -.53 -.211 -1.039 -.586 -1.414c-.375 -.375 -.884 -.586 -1.414 -.586h-4c-.53 0 -1.039 .211 -1.414 .586c-.375 .375 -.586 .884 -.586 1.414v6m8 0h-8m8 0h1m-9 0h-1" />
              <path d="M8 14v.01" />
              <path d="M8 17v.01" />
              <path d="M12 13.99v.01" />
              <path d="M12 17v.01" />
            </svg>
            <span class="is-drawer-close:hidden">Payments</span>
          </a>
        </li>

      </ul>
    </div>
  </div>
</div>
